name: Deploy backend

on:
  push:
    branches: master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B package -DskipTests

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Yuklash va restart
        run: |
          JAR=$(ls target/*.jar | grep -v original | head -1)
          scp "$JAR" root@${{ secrets.SERVER_HOST }}:/opt/famousbooks/app.jar.new
          ssh root@${{ secrets.SERVER_HOST }} "
            cd /opt/famousbooks &&
            mv app.jar.new app.jar &&
            chown famousbooks:famousbooks app.jar &&
            systemctl restart famousbooks
          "