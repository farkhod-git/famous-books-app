name: Deploy backend

on:
  push:
    branches: [master]

env:
  # ghcr.io/farkhod-git/famous-books-app
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # GHCR'ga push qilish uchun

    steps:
      - uses: actions/checkout@v4

      # Buildx — qatlam cache'ini GitHub'da saqlash uchun kerak
      - uses: docker/setup-buildx-action@v3

      - name: GHCR'ga kirish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Java va Maven bu yerda kerak emas — build Dockerfile ichida bo'ladi
      - name: Image build va push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # pom.xml o'zgarmasa, bog'liqliklar qatlami cache'dan keladi
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH sozlash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # Compose fayli o'zgarsa server ham yangilanishi kerak.
      # .env serverda qo'lda turadi va hech qachon bu yerdan yuborilmaydi.
      - name: Compose faylini yuklash
        run: scp docker-compose.yml root@${{ secrets.SERVER_HOST }}:/opt/famousbooks/docker-compose.yml

      - name: Serverda yangilash
        run: |
          ssh root@${{ secrets.SERVER_HOST }} "
            set -e
            cd /opt/famousbooks
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export APP_TAG=${{ github.sha }}
            docker compose pull app
            docker compose up -d --no-build
            docker logout ghcr.io
            docker image prune -f
          "
