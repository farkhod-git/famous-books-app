server:
  servlet:
    context-path: /api

jwt:
  access-token:
    expiry: 3600
    secret-key: ${JWT_ACCESS_SECRET}

  refresh-token:
    expiry: 86400
    secret-key: ${JWT_REFRESH_SECRET}

spring:
  application:
    name: famous-books-app

  # IDE yoki `mvn spring-boot:run` uchun .env'ni o'qiydi.
  # Docker'da o'zgaruvchilar muhitdan keladi va ustun turadi.
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000